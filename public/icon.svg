<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with stadium border -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Center divider representing court net / scoreboard divider -->
  <line x1="256" y1="48" x2="256" y2="464" stroke="#475569" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round" />

  <!-- Team Left (Blue) Side Board -->
  <rect x="42" y="70" width="194" height="372" rx="32" fill="#030712" stroke="#1e293b" stroke-width="3" />
  <rect x="42" y="70" width="194" height="12" rx="6" fill="#38bdf8" />
  <circle cx="70" cy="112" r="10" fill="#38bdf8" />
  <!-- Score 25 -->
  <text x="139" y="300" font-family="-apple-system, system-ui, 'Chakra Petch', monospace" font-size="140" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4" filter="url(#glowEffect)">25</text>
  <text x="139" y="375" font-family="sans-serif" font-size="22" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="3">SET 1</text>

  <!-- Team Right (Red) Side Board -->
  <rect x="276" y="70" width="194" height="372" rx="32" fill="#030712" stroke="#1e293b" stroke-width="3" />
  <rect x="276" y="70" width="194" height="12" rx="6" fill="#f43f5e" />
  <circle cx="304" cy="112" r="10" fill="#f43f5e" />
  <!-- Score 21 -->
  <text x="373" y="300" font-family="-apple-system, system-ui, 'Chakra Petch', monospace" font-size="140" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4" filter="url(#glowEffect)">21</text>
  <text x="373" y="375" font-family="sans-serif" font-size="22" font-weight="800" fill="#f43f5e" text-anchor="middle" letter-spacing="3">SET 1</text>

  <!-- Golden Sports Emblem Badge at bottom center -->
  <circle cx="256" cy="256" r="38" fill="#0f172a" stroke="#fbbf24" stroke-width="4" />
  <path d="M256 230 L262 248 L281 248 L266 260 L272 278 L256 266 L240 278 L246 260 L231 248 L250 248 Z" fill="url(#gold)" />
</svg>
